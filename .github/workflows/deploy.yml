name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux x86_64 (native)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            filename: mc-linux-x86_64.tar.gz
            cross: false

          # Linux aarch64 (cross)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            filename: mc-linux-aarch64.tar.gz
            cross: true

          # Windows x86_64 (native)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            filename: mc-windows-x86_64.zip
            cross: false

          # macOS arm64 (native)
          - os: macos-latest
            target: aarch64-apple-darwin
            filename: mc-macos-aarch64.tar.gz
            cross: false

          # macOS x86_64 (native)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            filename: mc-macos-x86_64.tar.gz
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            mise run cross -- --target ${{ matrix.target }}
          else
            mise run build -- --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mc dist/mc
          tar -czf dist/${{ matrix.filename }} -C dist mc

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\${{ matrix.target }}\release\mc.exe dist\mc.exe
          Compress-Archive -Path dist\mc.exe -DestinationPath dist\${{ matrix.filename }} -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.filename }}
          path: |
            dist/${{ matrix.filename }}

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/**/*
